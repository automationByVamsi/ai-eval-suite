# ============================================================================================
#  METRIC LIBRARY — the built-in judges every agent can use by name in its agent.yaml
# ============================================================================================
#
#  Which engine runs a metric (the only rule):
#    - `pegasus:` is set and the Pegasus package is installed  -> Pegasus
#    - otherwise                                                -> DeepEval (`deepeval:` or `criteria:`)
#
#  Keys
#    needs      fields the judge reads: question, answer, contexts, expected_answer.
#               If a case has no value for one of them, the judge is SKIPPED for that case.
#    pegasus    class name in pegasus.metrics.rag (or in pegasus.metrics.<module>, see module)
#    module     the Pegasus module when it isn't rag, e.g. agentic
#    columns    for a non-rag Pegasus metric: our field -> Pegasus' column name, e.g.
#               {question: query, answer: agent_response, background: background}
#    deepeval   class name in deepeval.metrics (the fallback, or the only engine)
#    criteria   DeepEval GEval with this text as the rubric (instead of a deepeval class)
#    question / answer / contexts / expected_answer: <field>
#               read that standard field from another parser field (see summarization)
#
#  Add a Pegasus metric:     add an entry with `pegasus:` + `needs:` (+ `deepeval:` if DeepEval
#                            has an equivalent, so machines without Pegasus can still run it).
#  Remove a metric:          delete its entry, and remove it from any agents/*/agent.yaml.
#  Agent-specific judges:    don't add them here — give them a `rubric:` in that agent's agent.yaml.
#
#  Per agent (in agents/<agent>/agent.yaml, not here), a metric can also set:
#    threshold: 0.8              pass mark, 0..1 (default 0.7)
#    engine: deepeval|pegasus    force one engine
#    method: pegasus|ragas|deepeval   which of Pegasus' own methods computes it (default pegasus;
#                                      RAG metrics only)
#    background: <text>          Pegasus' background column (metrics whose columns: include it)
#    options: {...}              extra arguments for the Pegasus class, e.g. use_ground_truth: true,
#                                json_path: <custom criteria file, relative to the agent folder>
#
#  Read by: src/metrics/library.py (checked when an agent loads, so a typo fails straight away).
# ============================================================================================

relevance:
  needs: [question, answer]
  pegasus: AnswerRelevancy
  deepeval: AnswerRelevancyMetric

faithfulness:
  needs: [question, answer, contexts]
  pegasus: Faithfulness
  deepeval: FaithfulnessMetric

correctness:
  needs: [question, answer, expected_answer]
  pegasus: AnswerCorrectness
  criteria: >
    Determine whether the actual output is factually correct and complete compared to the
    expected output, for the given input.

context_precision:
  needs: [question, answer, expected_answer, contexts]
  pegasus: ContextPrecision
  deepeval: ContextualPrecisionMetric

context_recall:
  needs: [question, answer, expected_answer, contexts]
  pegasus: ContextRecall
  deepeval: ContextualRecallMetric

contextual_relevancy:
  needs: [question, answer, contexts]
  deepeval: ContextualRelevancyMetric

summarization:                      # is `answer` a good summary of the source text?
  needs: [question, answer]
  question: source_document         # the agent's parser.py must provide the source text as source_document
  deepeval: SummarizationMetric

# --- Agentic (pegasus.metrics.agentic) -------------------------------------------------------

response_alignment:                 # does the response fit what the user asked for (query + background)?
  needs: [question, answer]
  pegasus: ResponseAlignment        # 1-10 scale, normalised by Pegasus to 0..1
  module: agentic
  columns: {question: query, answer: agent_response, background: background, expected_answer: expected_response}
