[project]
name = "ai-eval-suite"
version = "2.0.0"
description = "Evaluate AI agents: call the agent, save the trace, run checks + LLM judges (Pegasus/DeepEval), compare builds."
requires-python = ">=3.12"
dependencies = [
    "deepeval>=3.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
]
# Pegasus is an internal package — install it separately (see README). Without it,
# Pegasus metrics fall back to DeepEval and the results say so.

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
