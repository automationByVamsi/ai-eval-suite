[project]
name = "ai-eval-framework"
version = "0.1.0"
description = "Agent-agnostic evaluation framework for AI agents (deterministic checks + DeepEval/CORTEX LLM-judge scoring)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "deepeval>=1.5",
    "pandas>=2.0",
    "pytest>=8.0",
    "streamlit>=1.59",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
