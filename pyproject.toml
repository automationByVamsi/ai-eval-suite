[project]
name = "ai-eval-suite"
version = "2.0.0"
description = "Evaluate AI agents: call the agent, save the trace, run checks + LLM judges (Pegasus/DeepEval), compare builds."
requires-python = ">=3.12"
dependencies = [
    "deepeval>=3.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# Pegasus: the bank's internal metrics package, from SAR (Artifactory). `make setup` installs it when
# this machine can reach SAR with your token (~/.netrc, see README); otherwise setup carries on without
# it and Pegasus metrics run on DeepEval. Kept in its own group so people without SAR access can still
# install everything else.
pegasus = ["lbg-pegasus>=2.2.0"]

[tool.uv]
package = false

# Where lbg-pegasus comes from (from the Pegasus installation guide, "uv option"). `explicit = true`:
# only lbg-pegasus is looked up here — every other package still comes from the normal index.
[[tool.uv.index]]
name = "lbg-pegasus"
url = "https://artefacts.lloydsbanking.cloud/repository/innersource-anlaip_pegas-python/simple/"
explicit = true

[tool.uv.sources]
lbg-pegasus = { index = "lbg-pegasus" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
