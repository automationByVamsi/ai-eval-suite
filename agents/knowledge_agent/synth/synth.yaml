# Knowledge Agent — generate test cases from Athena knowledge-base pages.
#
#   make sources AGENT=knowledge_agent [GROUP="Recoveries Commercial Bank"] [IDS="36626"]   fetch pages -> cache/
#   make goldens AGENT=knowledge_agent [GROUP=..] [IDS=..] [STYLES=..] [REPLACE=1]         generate -> testdata/synthetic/<domain>/
#                                                       (privacy -> testdata/privacy/, should_decline -> testdata/should_decline/)
#   make run     AGENT=knowledge_agent SUITE=synthetic                                        evaluate the agent on them
#
# Paths are relative to this folder. The generator model is the CORTEX model in .env.

# 1. SOURCE — where the documents come from.  Other types: files, json_records, or your own in src/synthesizer/sources/
source:
  type: athena_mcp
  ids_file: page_ids.json            # page ids grouped by domain; GROUP= picks domains, IDS= picks pages

# Business areas: page_ids.json groups are matched to ../domains.yaml (the 25 official names and their
# aliases), the same list the golden importer uses, so ids, folders and business_area are written alike.

# 2. GENERATOR
include_expected_answer: true        # also generate the reference answer (used by the correctness judge)
per_source: 1                        # cases per page per style (a style can override it)
instructions: instructions.md        # rules every style must follow

styles:                              # one file per question style, see styles/; STYLES= picks some
  # The five answer types the Knowledge Agent gives. Typed styles are sent with question_type (agent.yaml
  # message:) and their reference answer has the agent's shape for that type.
  how:     {file: styles/how.md,    question_type: how}      # steps: simple + complex/conditional procedures
  what:    {file: styles/what.md,   question_type: what}     # definitions: terms, direct facts, eligibility
  why:     {file: styles/why.md,    question_type: why}      # reasoned summary: the page's stated reasons
  yes_no:  {file: styles/yes_no.md, question_type: yes_no}   # yes/no + why: permissions, conditions, eligibility
  general: {file: styles/general.md}                         # no question_type: plain text, summary answer

  # Special sets, capped (max_cases) and spread across domains, written to their own suites.
  privacy:                           # made-up customer details in the question (privacy leakage judge)
    file: styles/privacy.md
    max_cases: 15
    output:
      folder: testdata/privacy/{domain_folder}
      id: "KA_PII_{domain}_{n:03}"
      case: {expected: {contains_pii: true}, metadata: {origin: SYNTHETIC_PII}}
  should_decline:                    # on-topic questions the page doesn't answer (correct abstention)
    file: styles/should_decline.md
    max_cases: 15
    output:
      folder: testdata/negative/decline/{domain_folder}
      id: "KA_DEC_{domain}_{n:03}"
      case:                          # the agent must refuse with one of these errors, not invent an answer
        expected: {should_decline: true, expected_error: [InsufficientContextError, GuardrailError], source_page_id: ""}
        metadata: {origin: SYNTHETIC_DECLINE}

evolutions:                          # how questions are varied; weights must add up to 1.0
  rounds: 1
  REASONING: 0.30
  CONCRETIZING: 0.25
  CONSTRAINED: 0.25
  HYPOTHETICAL: 0.10
  COMPARATIVE: 0.05
  IN_BREADTH: 0.05

quality_filter:                      # regenerate questions the critic scores below min_quality
  min_quality: 0.5
  retries: 3

# 3. OUTPUT TEMPLATE — the shape of one generated test case.
# Placeholders: {generated.input} {generated.expected_output} {source.id} {source.title} {source.text}
#   {source.metadata.<key>} {style} {question_type} {group} {domain_name} {domain_path} {domain} {domain_folder} {run.id}
#   {run.generated_at} {run.date} {run.model} {agent.name} {agent.input_field} {id} {n:03}
# folder is relative to agents/knowledge_agent/; n numbers the cases inside that folder.
# Domain-wise, like the golden importer (names from ../domains.yaml):
#   {domain_folder}  customer_vulnerability_hub      folder
#   {domain}         CUSTOMER_VULNERABILITY_HUB      id: KA_SYN_CUSTOMER_VULNERABILITY_HUB_001
#   {domain_path}    /Customer_Vulnerability_Hub/    sent to the agent as business_area
#   {domain_name}    Customer Vulnerability Hub      readable name, kept in metadata
output:
  folder: testdata/synthetic/{domain_folder}
  id: "KA_SYN_{domain}_{n:03}"
  case:
    test_case_id: "{id}"
    description: "Synthesized {style} case from Athena page {source.id} ({source.title})"
    input:
      question: "{generated.input}"
      question_type: "{question_type}"      # typed styles only; left out for generic ones
      business_area: "{domain_path}"        # the agent's format, e.g. /Customer_Vulnerability_Hub/
    expected:
      expected_answer: "{generated.expected_output}"
      source_page_id: "{source.id}"
    metadata:
      origin: SYNTHETIC_PAGE
      approval_status: UNREVIEWED
      generation_scope: SINGLE_PAGE
      style: "{style}"
      question_type: "{question_type}"
      domain: "{domain}"
      business_area_name: "{domain_name}"
      group: "{group}"
      source_page_title: "{source.title}"
      source_revision: "{source.metadata.revision}"
      generation_run_id: "{run.id}"
      generated_at: "{run.generated_at}"
      generator_model: "{run.model}"
