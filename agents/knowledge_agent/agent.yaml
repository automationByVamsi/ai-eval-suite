# Knowledge Agent — RAG over the knowledge base (query rewrite -> search -> anchor -> ... -> answer)

connection:                   # how to reach the agent (Google ADK)
  base_url: ${KNOWLEDGE_ADK_BASE_URL:-http://localhost:8080}
  base_path: ${KNOWLEDGE_ADK_BASE_PATH:-}
  app_name: ${KNOWLEDGE_ADK_APP_NAME:-knowledge_agent}
  user_id: ${KNOWLEDGE_ADK_USER_ID:-eval_user}
  timeout_s: 180
  retries: 1
  verify_tls: false          # local/sandbox only — use true or a CA bundle path elsewhere
  headers: {}

input_field: question        # testdata input.question is sent to the agent

# Every metric the agent can be judged on. Built-ins run on Pegasus when Pegasus has them,
# otherwise DeepEval. Metrics with a rubric run on DeepEval GEval.
metrics:
  relevance:    {threshold: 0.7}
  faithfulness: {threshold: 0.7}
  correctness:  {threshold: 0.7}   # needs expected.expected_answer in the case, else skipped

  # Stage 1 — query rewrite: judge the rewritten query against the user's question
  intent_preservation:    {rubric: rubrics/intent_preservation.md,    answer: rewritten_query}
  semantic_preservation:  {rubric: rubrics/semantic_preservation.md,  answer: rewritten_query}
  domain_appropriateness: {rubric: rubrics/domain_appropriateness.md, answer: rewritten_query}
  query_optimization:     {rubric: rubrics/query_optimization.md,     answer: rewritten_query}

  # Stage 2 — anchor page: judge the chosen page. Needs the page text (anchor_page_content), which the
  # trace doesn't carry today, so these SKIP until it is added to fields.yaml.
  anchor_relevance:         {rubric: rubrics/anchor_relevance.md, answer: anchor_page_content}
  anchor_grounding_quality: {rubric: rubrics/anchor_grounding_quality.md,
                             question: rewritten_query, answer: anchor_page_content}

# Deterministic checks: run on every case of every suite, on the fields from fields.yaml.
# A check whose expected value a case lacks is SKIPPED. Types: see src/fields/checks.py.
checks:
  # Workflow integrity: answer
  answer_min_words:       {type: min_words, field: answer, min: 8}
  no_internal_markers:    {type: not_contains, field: answer,
                           values: [page_ids, anchor_page, artifact_id, rewritten_query, search_branches]}
  question_passed_through: {type: equals, field: agent_query, other: question}
  confidence_valid:       {type: one_of, field: confidence, values: [HIGH, MEDIUM, LOW]}

  # Workflow integrity: stages
  rewrite_present:        {type: present, field: rewritten_queries}
  branch_per_sub_query:   {type: same_count, fields: [rewritten_queries, branch_sub_queries]}
  anchor_per_branch:      {type: same_count, fields: [branch_sub_queries, branch_anchor_ids]}
  anchor_from_search:     {type: subset, field: anchor_page_ids, of: [search_candidates]}
  validation_scores_in_range: {type: range, fields: [relevance_score, applicability_score, sufficiency_score],
                               min: 0, max: 1}

  # Citations: every cited page was actually used, and is listed in the evidence
  citations_in_evidence_set:    {type: subset, field: cited_page_ids, of: [anchor_page_ids, expanded_page_ids]}
  citations_listed_in_evidence: {type: subset, field: cited_page_ids, of: [evidence_page_ids]}

  # Honest degradation: a fallback or a non-HIGH confidence must be disclosed to the caller
  fallback_disclosed:     {type: present, field: disclosures, when: {field: metadata_missing, is: true}}
  caveat_when_not_high:   {type: present, field: disclosures, when: {field: confidence, in: [MEDIUM, LOW]}}

  # Retrieval — golden cases (need expected pages; ids or titles, whichever the case has)
  anchor_hit:
    type: any_in
    compare:
      - {field: anchor_page_ids, expected: expected_anchor_page_ids}
      - {field: anchor_titles,   expected: expected_anchor_page_titles}
  expansion_precision:
    type: precision
    threshold: 0.7
    compare:
      - {field: expanded_page_ids, expected: expected_related_page_ids}
      - {field: expanded_titles,   expected: expected_related_page_titles}
  expansion_recall:
    type: recall
    threshold: 0.7
    compare:
      - {field: expanded_page_ids, expected: expected_related_page_ids}
      - {field: expanded_titles,   expected: expected_related_page_titles}

# Which metrics each suite runs. testdata defaults to testdata/<suite name>.
suites:
  sanity:
    metrics: [relevance, correctness]
  stages:
    testdata: testdata/sanity
    metrics: [intent_preservation, semantic_preservation, domain_appropriateness,
              query_optimization, anchor_relevance, anchor_grounding_quality]
  golden:                    # CJM golden cases: make import-cases (see importers/cjm_golden.yaml)
    metrics: [relevance, correctness]    # faithfulness: add once the trace carries the evidence page text
  synthetic:                 # generated by `make goldens` (see synth/) — coverage, not a release gate
    metrics: [relevance]
  e2e:
    testdata: testdata/sanity
    metrics: [relevance, faithfulness, correctness,
              intent_preservation, semantic_preservation, domain_appropriateness,
              query_optimization, anchor_relevance, anchor_grounding_quality]
