# Knowledge Agent — RAG over the knowledge base (query rewrite -> search -> anchor -> ... -> answer)

connection:                   # how to reach the agent (Google ADK)
  base_url: ${KNOWLEDGE_ADK_BASE_URL:-http://localhost:8080}
  base_path: ${KNOWLEDGE_ADK_BASE_PATH:-}
  app_name: ${KNOWLEDGE_ADK_APP_NAME:-knowledge_agent}
  user_id: ${KNOWLEDGE_ADK_USER_ID:-eval_user}
  timeout_s: 180
  retries: 1
  verify_tls: false          # local/sandbox only — use true or a CA bundle path elsewhere
  headers: {}

input_field: question        # testdata input.question is sent to the agent
# A case with a question_type is sent as JSON in the message text: {"query": ..., "question_type": "how"}
# (the agent's input contract). A case with only a question is sent as plain text.
message:
  format: json
  fields: {query: question, question_type: question_type}

# Every metric the agent can be judged on. Built-ins run on Pegasus when Pegasus has them,
# otherwise DeepEval. Metrics with a rubric run on DeepEval GEval.
metrics:
  relevance:    {threshold: 0.7}
  faithfulness: {threshold: 0.7}
  correctness:  {threshold: 0.7}   # needs expected.expected_answer in the case, else skipped
  context_recall:    {threshold: 0.7}   # golden: do the retrieved pages contain the golden answer?
  context_precision: {threshold: 0.7}   # golden: are the retrieved pages relevant to it (not noise)?

  # Does the answer fit what was asked, in the shape its question_type calls for? Pegasus agentic
  # ResponseAlignment, judging the whole final output (question_type + answer) as JSON.
  response_alignment:
    threshold: 0.7
    answer: agent_response
    background: >-
      The agent answers colleagues' questions from the bank's knowledge base. The response is the
      agent's JSON output; question_type says what kind of answer was requested, and the answer
      must have the matching shape: how = ordered, actionable steps; what = definitions of the key
      terms asked about; yes_no = a clear yes or no, then an explanation; why and general = a
      reasoned summary. Judge whether the answer uses the shape for its question_type and fully
      answers the query. Do not judge factual accuracy against outside knowledge.

  # Stage 1 — query rewrite: judge the rewritten query against the user's question
  intent_preservation:    {rubric: rubrics/intent_preservation.md,    answer: rewritten_query}
  semantic_preservation:  {rubric: rubrics/semantic_preservation.md,  answer: rewritten_query}
  domain_appropriateness: {rubric: rubrics/domain_appropriateness.md, answer: rewritten_query}
  query_optimization:     {rubric: rubrics/query_optimization.md,     answer: rewritten_query}

  # Stage 2 — anchor page: judge the chosen page. Its text (anchor_page_content) is looked up from
  # Athena by fields.yaml (lookups.py), like the evidence for faithfulness.
  anchor_relevance:         {rubric: rubrics/anchor_relevance.md, answer: anchor_page_content}
  anchor_grounding_quality: {rubric: rubrics/anchor_grounding_quality.md,
                             question: rewritten_query, answer: anchor_page_content}

# Deterministic checks, in groups (the dashboard shows them by group). They read the fields from
# fields.yaml; a check whose expected value a case lacks is SKIPPED. Types: see src/fields/checks.py.
# Each suite picks what it runs with `checks:` (below): all (the default), none, or groups / names.
# "basic" (answer_non_empty, expected.keywords) is built in.
checks:
  answer:                     # the answer the caller receives is well-formed
    answer_min_words:       {type: min_words, field: answer, min: 8}
    no_internal_markers:    {type: not_contains, field: answer,
                             values: [page_ids, anchor_page, artifact_id, rewritten_query, search_branches]}
    question_passed_through: {type: equals, field: agent_query, other: question}
    confidence_valid:       {type: one_of, field: confidence, values: [HIGH, MEDIUM, LOW]}

  pipeline:                   # every stage ran and handed over what the next one needs
    rewrite_present:        {type: present, field: rewritten_queries}
    branch_per_sub_query:   {type: same_count, fields: [rewritten_queries, branch_sub_queries]}
    anchor_per_branch:      {type: same_count, fields: [branch_sub_queries, branch_anchor_ids]}
    anchor_from_search:     {type: subset, field: anchor_page_ids, of: [search_candidates]}
    validation_scores_in_range: {type: range, fields: [relevance_score, applicability_score, sufficiency_score],
                                 min: 0, max: 1}

  citations:                  # every cited page was actually used, and is listed in the evidence
    citations_in_evidence_set:    {type: subset, field: cited_page_ids, of: [anchor_page_ids, expanded_page_ids]}
    citations_listed_in_evidence: {type: subset, field: cited_page_ids, of: [evidence_page_ids]}

  performance:                # MVP success metric: a response within 60 seconds
    within_60s:             {type: range, field: latency_ms, min: 0, max: 60000}

  explainability:             # MVP success metric: the trace shows how the answer was derived
    anchor_rationale_logged:     {type: present, field: anchor_rationales}
    validation_reasons_logged:   {type: present, fields: [relevance_reason, applicability_reason, sufficiency_reason]}
    page_link_for_every_source:  {type: same_count, fields: [evidence_page_ids, evidence_links]}
    sources_listed:              {type: present, field: evidence_page_ids}

  honesty:                    # should-decline cases (expected.should_decline: true): no confident answer
    warns_when_it_cannot_answer: {type: present, field: disclosures, when: {expected: should_decline, is: true}}
    not_high_confidence_when_it_cannot_answer:
      type: one_of
      field: confidence
      values: [MEDIUM, LOW]
      when: {expected: should_decline, is: true}

  disclosure:                 # a fallback or a non-HIGH confidence is disclosed to the caller
    fallback_disclosed:     {type: present, field: disclosures, when: {field: metadata_missing, is: true}}
    caveat_when_not_high:   {type: present, field: disclosures, when: {field: confidence, in: [MEDIUM, LOW]}}

  retrieval:                  # golden cases: the expected pages were found (ids or titles, whichever the case has)
    anchor_hit:
      type: any_in
      compare:
        - {field: anchor_page_ids, expected: expected_anchor_page_ids}
        - {field: anchor_titles,   expected: expected_anchor_page_titles}
    expansion_precision:
      type: precision
      threshold: 0.7
      compare:
        - {field: expanded_page_ids, expected: expected_related_page_ids}
        - {field: expanded_titles,   expected: expected_related_page_titles}
    expansion_recall:
      type: recall
      threshold: 0.7
      compare:
        - {field: expanded_page_ids, expected: expected_related_page_ids}
        - {field: expanded_titles,   expected: expected_related_page_titles}
    # Search results (Precision@k / Recall@k). Measured on the candidates the agent LOGS in the trace
    # (search_branches.*.filtered_page_ids, in logged order) — the only search evidence we have.
    search_recall_at_5:       # every expected anchor page is among the first 5 logged candidates
      type: recall
      k: 5
      threshold: 1.0
      compare:
        - {field: search_candidates, expected: expected_anchor_page_ids}
    search_precision_at_5:    # share of the first 5 candidates that are expected pages (reported, not gated)
      type: precision
      k: 5
      threshold: 0
      compare:
        - {field: search_candidates, expected: [expected_anchor_page_ids, expected_related_page_ids]}
    query_type_match:         # the agent classified simple / complex as the golden sheet says
      type: any_in
      field: query_type
      expected: expected_query_type
    source_page_found:        # synthetic: the page the question was generated from is in the evidence
      type: any_in
      field: evidence_page_ids
      expected: source_page_id

# Consistency (REPS > 1, HIVE-6165): a case is consistent only if the source pages are the same in
# every repetition AND correctness passed every time. An inconsistent case counts as a failure.
consistency:
  same: evidence_page_ids
  min_overlap: 1.0
  all_pass: [correctness]

# Which judges (metrics:) and which deterministic checks (checks:) each suite runs.
#   checks: all                      every check (the default when checks: is left out)
#   checks: none                     judges only
#   checks: [basic, citations]       these groups and/or check names
#   targets: {correctness: 0.9}      release targets: pass RATE across the run (see src/reporting/release.py)
# testdata defaults to testdata/<suite name>.
suites:
  sanity:                    # release gate: every case must pass
    metrics: [relevance, correctness, faithfulness]
    targets: {case_pass_rate: 1.0, error_rate: 0.05}
  relevance_only:            # one judge, no deterministic checks (and no Athena fetch: nothing needs page text)
    testdata: testdata/sanity
    metrics: [relevance]
    checks: none
  faithfulness_only:         # one judge; the evidence page text is fetched from Athena (once, then reused)
    testdata: testdata/sanity
    metrics: [faithfulness]
    checks: none
  question_types:            # the same kind of question asked as how / what / why / yes_no (sends question_type)
    metrics: [relevance, response_alignment]
    checks: [basic, answer]
  response_alignment_only:
    testdata: testdata/question_types
    metrics: [response_alignment]
    checks: none
  stages:
    testdata: testdata/sanity
    metrics: [intent_preservation, semantic_preservation, domain_appropriateness,
              query_optimization, anchor_relevance, anchor_grounding_quality]
    checks: [basic, pipeline]
  golden:                    # CJM golden cases: make import-cases (see importers/cjm_golden.yaml)
    metrics: [relevance, correctness, faithfulness, context_recall, context_precision, response_alignment]
    targets:                 # MVP success metrics (Sonalee) + MVP Testing Plan; pass RATES across the run
      correctness: 0.90
      faithfulness: 0.95
      context_precision: 0.90
      context_recall: 0.90
      anchor_hit: 0.80
      within_60s: 0.95       # proposed: "response within 60 seconds"
      error_rate: 0.05       # "system error rate < 5%"
      consistency: 1.0       # with REPS > 1 (HIVE-6165)
  should_decline:            # questions the knowledge base can't answer: the agent must warn, not answer confidently
    metrics: []
    checks: [honesty, performance]
    targets: {warns_when_it_cannot_answer: 1.0, not_high_confidence_when_it_cannot_answer: 1.0}
  synthetic:                 # generated by `make goldens` (see synth/) — coverage, not a release gate
    metrics: [relevance, faithfulness]
    checks: [basic, answer, citations, source_page_found]
  e2e:
    testdata: testdata/sanity
    metrics: [relevance, faithfulness, correctness,
              intent_preservation, semantic_preservation, domain_appropriateness,
              query_optimization, anchor_relevance, anchor_grounding_quality]
