# Knowledge Agent ingestion — does the Markdown keep the Athena page's structure and text?
# The numbers come from parser.py (Athena HTML counted vs Markdown counted).
checks:
  structure:                  # the same building blocks as the page
    headings_kept:   {type: equals, field: md_headings,     other: source_headings}
    list_items_kept: {type: equals, field: md_list_items,   other: source_list_items}
    table_rows_kept: {type: equals, field: md_table_rows,   other: source_table_rows}
    links_kept:      {type: equals, field: md_links,        other: source_links}

  content:                    # the page's text is all there (missing_lines shows what isn't)
    text_coverage:   {type: range, field: text_coverage, min: 0.98, max: 1}

  version:                    # the Markdown was made from the page as it is now (skipped if no revision stored)
    same_revision:   {type: equals, field: md_revision, other: athena_revision, when: {field: md_revision, present: true}}
