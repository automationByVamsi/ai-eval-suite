# Knowledge Agent ingestion — is the pipeline's Markdown a faithful copy of the Athena page?
#
# Not a chat agent: client.py reads, for each test case's page_id, the page's files the preprocessing
# pipeline stored in GCS — page.md (the output) and metadata.json, whose content.html is the HTML it
# converted (the source) — plus the page's current revision from Athena. The framework judges the
# Markdown against that HTML like any agent's answer. Sign in to Google Cloud first:
#     make gcloud-auth
#     make ingestion-cases                                    # one case per page found in the bucket
#     make run AGENT=knowledge_agent/ingestion SUITE=markdown

connection:                   # where the pipeline's files are (passed to client.py)
  md_bucket: ${GCS_MD_BUCKET:-ew2-wrk-int-wrk01-svp-dfadf4-sbk-md-store}
  md_path: ${GCS_MD_PATH:-<page_id>.md}                 # only for cases without md_path (make ingestion-cases adds it)
  metadata_bucket: ${GCS_JSON_BUCKET:-ew2-wrk-int-wrk01-svp-dfadf4-sbk-json-store}
  metadata_path: ${GCS_METADATA_PATH:-<page_id>.json}   # the source HTML (else the live Athena page)

input_field: page_id          # each test case's input.page_id is the page to check
message:                      # sent to client.py as JSON: the page id and its exact files in the buckets
  format: json
  fields: {page_id: page_id, md_path: md_path, metadata_path: metadata_path}

metrics:
  # Nothing added or changed: Pegasus safety Hallucination with the source page's text as the context
  # (raw 1-10 normalised; 0.66 = raw 7, "minimal" passes).
  markdown_hallucination: {type: hallucination, threshold: 0.66, question: conversion_task}
  # Nothing lost: a rubric judge (DeepEval GEval) — Pegasus has no completeness metric for this yet.
  markdown_completeness:
    rubric: rubrics/markdown_completeness.md
    needs: [answer, contexts]
    threshold: 0.7

suites:
  markdown:                   # source HTML -> pipeline Markdown: structure checks + two judges
    metrics: [markdown_hallucination, markdown_completeness]
