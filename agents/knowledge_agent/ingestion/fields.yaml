# Knowledge Agent ingestion — fields read from the trace client.py builds for one page:
#   trace.agentOutput   the pipeline's Markdown            trace.athena    page_id, title, revision, html
#   trace.context       [the Athena page as plain text]    trace.metadata  the pipeline's metadata JSON (or null)
#   trace.files         the gs:// paths that were read
# Structure counts and text coverage come from parser.py.

fields:
  page_title:       trace.athena.title
  conversion_task:  trace.task                      # the "question" the hallucination judge is given
  athena_revision:  trace.athena.revision
  # The revision the pipeline stored. TODO: confirm the key in the metadata JSON; the first one found wins.
  md_revision:      {path: [trace.metadata.revision, 'trace.metadata."@revision"', trace.metadata.athena_revision,
                            trace.metadata.page_revision]}
  markdown_file:    trace.files.markdown
