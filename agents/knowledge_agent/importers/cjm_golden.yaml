# Knowledge Agent — import the CJM golden spreadsheet into test cases.
#
#   make import-cases AGENT=knowledge_agent FILE="~/Downloads/KA golden.xlsx"             write the cases
#   make import-cases AGENT=knowledge_agent FILE="~/Downloads/KA golden.xlsx" DRY_RUN=1   preview only
#   make run          AGENT=knowledge_agent SUITE=golden                                  evaluate them
#
# The importer (src/importers/cases.py) is the same for every agent; this file says what this
# spreadsheet's columns mean and what a Knowledge Agent test case looks like.
#
# Naming convention (the same for golden and synthetic cases; the business areas are in ../domains.yaml):
#   test case id   KA_GLD_<BUSINESS_AREA>_<test id, 3 digits>   e.g. KA_GLD_COMPLAINT_MANAGERS_001 = Test ID 1
#   file           testdata/golden/<business_area>/<test case id>.json   e.g. golden/complaint_managers/
#   sent as        business_area: Complaint_Managers   (the agent's format)
# The Excel Test ID stays in the id, so any case can be found in the sheet again (and its row is
# in metadata.source). Keep Test IDs unique across the sheet: duplicates stop the import.

sheet: Sheet1                 # SHEET= on the command line overrides it
header_row: 1                 # the row that holds the column headers

columns:                      # our name: header text in the sheet (case and extra spaces don't matter)
  test_id:          Test ID
  workstream:       Workstream
  query_type:       Query Type
  question:         User Query
  question_type:    Question Type
  expected_answer:  Expected Golden Answer
  anchor_pages:     Expected - Anchor Page
  related_pages:    Expected Relational Page
  page_ids:         Page Ids  # "Anchor: 26942  Relational: 8412; 7053; 3140" (Athena page ids)

required: [test_id, question]          # rows missing these are skipped, and listed in the summary
empty_values: [NA, N/A, "-", none, TBC]

labelled:                     # the Page Ids cell holds both kinds of id, each after its label
  page_ids:
    Anchor: anchor_page_ids
    Relational: related_page_ids
  # A cell with ids but no labels counts as anchor ids.

normalise:
  query_type: lower           # Simple -> simple (the agent's own query_type values)
  question_type: slug         # How -> how, Yes/No -> yes_no

allowed:                      # question types the agent accepts; any other value (Explanation, Procedural ...)
  question_type: [how, what, why, yes_no]   # is left out, so the question goes as a general one (plain text)

lists:                        # cells that can hold several values
  anchor_pages: items         # page titles, one per line or separated by ;
  related_pages: items        # (titles can contain commas and dashes, so only lines and ; split them)
  anchor_page_ids: any        # ids separated by new lines, commas, semicolons or spaces
  related_page_ids: any

strip:                        # titles in the sheet end with their page id, e.g. "Card not Present Fraud (3012)":
  anchor_pages: '\s*\(\s*\d+\s*\)\s*$'      # drop it, so titles compare with the agent's titles
  related_pages: '\s*\(\s*\d+\s*\)\s*$'

domain:
  column: workstream          # the business area is the Workstream column, matched to ../domains.yaml
  # (its official name or an alias, e.g. "CVH"). One not listed still imports, with a warning.

warn_if_empty:                # reported after the import, so gaps in the sheet are visible
  expected_answer: correctness judge will be skipped
  anchor_pages: anchor check will be skipped

output:
  folder: testdata/golden/{domain_folder}
  id: "KA_GLD_{domain}_{row.test_id:03}"
  case:
    test_case_id: "{id}"
    description: "CJM golden, Test ID {row.test_id} ({row.workstream})"
    input:
      question: "{row.question}"
      question_type: "{row.question_type}"     # sent to the agent (agent.yaml message:); empty -> left out
      business_area: "{domain_path}"           # the agent's format, e.g. Complaint_Managers
    expected:
      expected_answer: "{row.expected_answer}"
      expected_anchor_page_titles: "{row.anchor_pages}"
      expected_anchor_page_ids: "{row.anchor_page_ids}"
      expected_related_page_ids: "{row.related_page_ids}"
      expected_related_page_titles: "{row.related_pages}"
      expected_query_type: "{row.query_type}"       # simple | complex (kept for reference; no check reads it)
    metadata:
      domain: "{domain}"
      business_area_name: "{domain_name}"
      workstream: "{row.workstream}"
      question_type_in_sheet: "{row.question_type_in_sheet}"   # as the sheet had it, even if not sent
      origin: CJM_GOLDEN
      approval_status: APPROVED
      source:
        file: "{source.file}"
        sheet: "{source.sheet}"
        row: "{source.row}"
        test_id: "{row.test_id}"
