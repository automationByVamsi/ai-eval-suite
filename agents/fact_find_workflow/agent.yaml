# Fact Find Workflow — given a complaint reference, produce a Customer FactFind Summary

connection:                   # how to reach the agent (Google ADK)
  base_url: ${FACTFIND_ADK_BASE_URL:-https://web203-int-ew2.c2.test.lbgcp.cloud/cct1/hive1/hive-complaints-agent}
  base_path: ${FACTFIND_ADK_BASE_PATH:-}
  app_name: ${FACTFIND_ADK_APP_NAME:-fact_find_workflow}
  user_id: ${FACTFIND_ADK_USER_ID:-bdduser}
  timeout_s: 420
  retries: 1
  verify_tls: false          # local/sandbox only — use true or a CA bundle path elsewhere
  headers:
    x-lbg-origin-client-id: ${CORTEX_CLIENT_ID}

input_field: complaint_ref

# contexts / source_document = the ground-truth payload (expected.ground_truth), see parser.py
metrics:
  relevance:     {threshold: 0.7}
  faithfulness:  {threshold: 0.7}
  summarization: {threshold: 0.7}

  validation_message_clarity:    {rubric: rubrics/validation_message_clarity.md, answer: invalid_message}
  support_needs_fidelity:        {rubric: rubrics/support_needs_fidelity.md,        needs: [question, answer, contexts], threshold: 0.8}
  profile_accuracy:              {rubric: rubrics/profile_accuracy.md,              needs: [question, answer, contexts], threshold: 0.8}
  missing_data_honesty:          {rubric: rubrics/missing_data_honesty.md,          needs: [question, answer, contexts], threshold: 0.8}
  complaint_account_association: {rubric: rubrics/complaint_account_association.md, needs: [question, answer, contexts], threshold: 0.8}
  factual_accuracy:              {rubric: rubrics/factual_accuracy.md,              needs: [question, answer, contexts], threshold: 0.8}
  summary_completeness:          {rubric: rubrics/summary_completeness.md,          needs: [question, answer, contexts], threshold: 0.8}
  summary_groundedness:          {rubric: rubrics/summary_groundedness.md,          needs: [question, answer, contexts], threshold: 0.8}

suites:
  sanity:
    metrics: [relevance, faithfulness]
  e2e:
    testdata: testdata/sanity
    metrics: [relevance, faithfulness, summarization, validation_message_clarity,
              support_needs_fidelity, profile_accuracy, missing_data_honesty,
              complaint_account_association]
