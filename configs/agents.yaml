# Lab agent inventory (committed). Secrets/hosts live in `.env` via ${VAR}.
#
# Adding an agent = add an entry here. Invoke code is always AdkClient
# (src/clients/adk_client.py) — same ADK session → /run → save JSON flow.
#
# metrics_profile → configs/metrics/<profile>/catalog.yaml (+ evaluation suites).

agents:
  knowledge_agent:
    metrics_profile: knowledge_agent
    app_name: ${KNOWLEDGE_ADK_APP_NAME:-knowledge_agent}
    user_id: ${KNOWLEDGE_ADK_USER_ID:-eval_user}
    base_url: ${KNOWLEDGE_ADK_BASE_URL:-http://localhost:8080}
    base_path: ${KNOWLEDGE_ADK_BASE_PATH:-}
    message_field: question
    timeout_s: 180
    verify_tls: false
    max_retries: 2
    headers: {}

  fact_find_workflow:
    metrics_profile: fact_find_workflow
    app_name: ${FACTFIND_ADK_APP_NAME:-fact_find_workflow}
    user_id: ${FACTFIND_ADK_USER_ID:-bdduser}
    base_url: ${FACTFIND_ADK_BASE_URL:-https://web203-int-ew2.c2.test.lbgcp.cloud/cct1/hive1/hive-complaints-agent}
    base_path: ${FACTFIND_ADK_BASE_PATH:-}
    message_field: complaint_ref
    timeout_s: 420
    # Internal LBG host — same as working factfind/ai-evals (unverified TLS).
    verify_tls: false
    max_retries: 1
    # Gateway auth (working repo ADK_HEADERS). Must be a YAML map, not a string.
    headers:
      x-lbg-origin-client-id: ${CORTEX_CLIENT_ID}
    headers_from_env:
      x-lbg-origin-client-id: CORTEX_CLIENT_ID
