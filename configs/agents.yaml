# Every agent the framework can evaluate. `type` must match a name registered
# in src/agents (see @AGENT_REGISTRY.register(...)). `metrics_profile` points
# at configs/metrics/<profile>.yaml for that agent's default metric set.
#
# Adding a new agent = add an entry here + implement BaseAgent. No code here changes.
agents:
  knowledge_agent_replay:
    type: replay
    metrics_profile: knowledge_agent
    config:
      trace_dir: outputs/traces/knowledge_agent/sanity

  knowledge_agent_live:
    type: adk
    metrics_profile: knowledge_agent
    config:
      base_url: https://internal-adk-host.example.com
      base_path: ""   # TODO: set if your ADK server is mounted under a path prefix
      app_name: knowledge_agent
      user_id: eval_user
      message_field: question
      timeout_s: 30
      verify_tls: true
      max_retries: 2
      headers: {}

  # Fact Find Workflow — complaint ref in → multi-system MCP gather → UI summary.
  # Live host/timeouts mirror the other-repo .env.factfind.api (no secrets here).
  fact_find_workflow_replay:
    type: replay
    metrics_profile: fact_find_workflow
    config:
      trace_dir: outputs/traces/fact_find_workflow/sanity

  fact_find_workflow_live:
    type: adk
    metrics_profile: fact_find_workflow
    config:
      base_url: https://web203-int-ew2.c2.test.lbgcp.cloud/cct1/hive1/hive-complaints-agent
      base_path: ""
      app_name: fact_find_workflow
      user_id: bdduser
      message_field: complaint_ref
      timeout_s: 420
      verify_tls: true
      max_retries: 1
      headers: {}
