# CORTEX judge — aligned with working factfind/ai-evals eval_config.py
#
# CORTEX_HOST should be the full gateway prefix ending at /v1/ (trailing slash OK).
# Client always POSTs to {host}{prefix}/chat/completions — do not use /generate.
cortex:
  base_url: ${CORTEX_HOST:-https://cortex.internal.example.com/int/control-plane-api/v1}
  # path kept for docs; CortexClient builds .../chat/completions from base_url like working repo
  path: /chat/completions
  model: ${CORTEX_MODEL:-vertex_ai/gemini-2.5-pro}
  temperature: 0.0
  timeout_s: 60
  verify_tls: false
  retries: 2
  headers_from_env:
    x-lbg-origin-client-id: CORTEX_CLIENT_ID
  extra_headers: {}
