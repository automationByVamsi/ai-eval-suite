# Knowledge Agent — metric definitions (once).
# Suites under configs/evaluations/knowledge_agent/ only *select* names from here.
#
# backends: which scoring paths this metric supports.
#   Suite ``mode:`` (default pegasus) picks among them; unsupported modes fall
#   back (e.g. GEval customs always stay on deepeval).
#
# default_suite: used by src.main / EvaluationRunner when a case has no suite/metrics.
default_suite: e2e

metrics:
  # --- Stage 1 (query rewrite) — GEval / DeepEval only ---
  intent_preservation:
    type: geval
    backends: [deepeval]
    threshold: 0.7
    rubric: configs/criteria/knowledge_agent/intent_preservation.md
    evaluation_params: [input, actual_output]
    input_source: question
    actual_source: rewritten_query

  semantic_preservation:
    type: geval
    backends: [deepeval]
    threshold: 0.7
    rubric: configs/criteria/knowledge_agent/semantic_preservation.md
    evaluation_params: [input, actual_output]
    input_source: question
    actual_source: rewritten_query

  domain_appropriateness:
    type: geval
    backends: [deepeval]
    threshold: 0.7
    rubric: configs/criteria/knowledge_agent/domain_appropriateness.md
    evaluation_params: [input, actual_output]
    input_source: question
    actual_source: rewritten_query

  query_optimization:
    type: geval
    backends: [deepeval]
    threshold: 0.7
    rubric: configs/criteria/knowledge_agent/query_optimization.md
    evaluation_params: [input, actual_output]
    input_source: question
    actual_source: rewritten_query

  # --- Stage 2 (anchor) — GEval / DeepEval only ---
  anchor_relevance:
    type: geval
    backends: [deepeval]
    threshold: 0.7
    rubric: configs/criteria/knowledge_agent/anchor_relevance.md
    evaluation_params: [input, actual_output]
    input_source: question
    actual_source: anchor_page_content

  anchor_grounding_quality:
    type: geval
    backends: [deepeval]
    threshold: 0.7
    rubric: configs/criteria/knowledge_agent/anchor_grounding_quality.md
    evaluation_params: [input, actual_output]
    input_source: rewritten_query
    actual_source: anchor_page_content

  # --- Final-answer / e2e (portable: suite mode selects pegasus* or deepeval) ---
  relevance:
    type: relevance
    backends: [pegasus, deepeval]
    threshold: 0.7
    input_source: question
    actual_source: answer
    context_source: retrieval_context

  correctness:
    type: correctness
    backends: [pegasus, deepeval]
    threshold: 0.7
    input_source: question
    actual_source: answer
    expected_source: expected_answer

  faithfulness:
    type: faithfulness
    backends: [pegasus, deepeval]
    threshold: 0.7
    input_source: question
    actual_source: answer
    context_source: retrieval_context

  # Pegasus-only in this repo (no DeepEval wrapper).
  context_precision:
    type: context_precision
    backends: [pegasus]
    threshold: 0.7
    input_source: question
    expected_source: expected_answer
    context_source: retrieval_context

  context_recall:
    type: context_recall
    backends: [pegasus]
    threshold: 0.7
    input_source: question
    actual_source: answer
    expected_source: expected_answer
    context_source: retrieval_context

  keyword_match:
    type: keyword_match
    backends: [deepeval]
    threshold: 1.0
    keywords_source: keywords
