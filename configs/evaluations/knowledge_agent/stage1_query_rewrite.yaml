# Stage 1 = query rewrite. `mode` controls which metrics run in addition to
# Layer 1 deterministic checks (see StageMetricRunner):
#   stage_only | global_only | stage_plus_global
mode: stage_plus_global

judge_metrics:
  - name: intent_preservation
    type: geval
    threshold: 0.7
    rubric: configs/criteria/knowledge_agent/intent_preservation.md
    evaluation_params: [input, actual_output]
    input_source: question
    actual_source: rewritten_query
