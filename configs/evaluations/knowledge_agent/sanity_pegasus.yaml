# Knowledge Agent — fuller Pegasus-oriented sanity pack.
# Same test file as sanity: tests/knowledge_agent/test_sanity.py
#
# Select: METRICS_SUITE=sanity_pegasus
# Mode: suite ``mode:`` below, or METRIC_MODE=pegasus|pegasus_ragas|pegasus_deepeval
#
# Strict contracts when mode is pegasus* (MetricContractError if fields missing):
#   relevance          → question, answer
#                        (+ retrieved_contexts when mode=pegasus_ragas)
#   faithfulness       → question, answer, retrieved_contexts
#   correctness        → question, answer, expected_answer
#   context_precision  → question, expected_answer, retrieved_contexts
#   context_recall     → question, answer, expected_answer, retrieved_contexts
#
# Cases without expected_answer / contexts will fail loud — only include judges
# whose contract your testdata satisfies, or add the missing fields to cases.
suite: sanity_pegasus
mode: pegasus

judges:
  - relevance
  - faithfulness
  - correctness
  - context_precision
  - context_recall
