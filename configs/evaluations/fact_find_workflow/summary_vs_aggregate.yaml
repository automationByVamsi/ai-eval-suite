# Summary vs aggregate = Customer FactFind Summary quality vs aggregated payload.
# Building block; usually selected via e2e include, or evaluate(..., "summary_vs_aggregate", ...).
# Definitions: configs/metrics/fact_find_workflow/catalog.yaml
#
# Needs response.context (+ source_document) from aggregated payload.
# Use parsers.fact_find_workflow.prepare_response + src.eval.prepare_sample before evaluate().
suite: summary_vs_aggregate

judges:
  # Built-in
  - faithfulness
  - relevance
  - summarization
  - task_completion
  # Domain GEval
  - support_needs_fidelity
  - profile_accuracy
  - missing_data_honesty
  - complaint_account_association
