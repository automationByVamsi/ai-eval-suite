# Fact Find — sanity suite (light smoke judges).
# Definitions: configs/metrics/fact_find_workflow/catalog.yaml
#
# mode: preferred backend for portable metrics. summarization is deepeval-only
# and always runs via DeepEval even when mode is pegasus.
#
# Select explicitly via METRICS_SUITE="sanity" (tests/conftest) or Verdict pack.
# Works on live run_case AgentResponse for both success and invalid-ref cases.
suite: sanity
mode: pegasus

judges:
  - relevance
  - summarization
